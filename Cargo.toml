[package]
name = "velocity-init"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <you@example.com>"]
description = "A modern, fast, supervised init system and service manager"

[[bin]]
name = "velocity-init"
path = "src/main.rs"

[[bin]]
name = "velocityctl"
path = "src/bin/velocityctl.rs"

[lib]
name = "velocity_init"
path = "src/lib.rs"

[dependencies]
nix = { version = "0.29", features = ["signal", "process", "fs", "event", "time", "mount", "uio", "socket", "poll", "net", "user", "reboot"] }
libc = "0.2"
thiserror = "1"
anyhow = "1"
log = { version = "0.4", features = ["std"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
